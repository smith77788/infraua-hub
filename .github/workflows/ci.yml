name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Every step below is the same package script `npm run check` runs, in
      # the same order, so a local check and CI cannot drift apart. They stay
      # separate steps here only so a failure names itself instead of being
      # reported as "check failed".
      #
      # The build does not typecheck — Vite strips types without checking them.
      # Every type error this repo has carried so far reached main precisely
      # because a green build was taken as proof, so this step runs first.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Платформа переїхала сюди з окремого репозиторію і живе під platform/.
      # У неї власний tsconfig (CommonJS, Node) і власні тести, тож кроки
      # окремі — падіння має називати себе.
      - name: Platform typecheck
        run: bun run platform:typecheck

      - name: Platform tests
        run: bun run platform:test

      - name: Platform build
        run: bun run platform:build

  # The air-radar backend is Python with its own tests, and nothing was running
  # them. Kept as a separate job so a failure there is attributable and does not
  # mask a frontend failure.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air-radar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: air-radar/requirements.txt

      - run: pip install -r requirements.txt

      # Seven of the ten tests need the geocoding database and fail without it.
      # It is built from a GeoNames dump rather than committed (162k records),
      # so CI builds it the same way a developer does.
      - name: Build the geocoding database
        run: python -m backend.build_geodb

      - name: Test
        run: python -m pytest backend/tests -q
